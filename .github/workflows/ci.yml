name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Build APK and run tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core engine + .knsproj format)
        run: ./gradlew --no-daemon :core:test

      # Rust library (text extrusion + Whisper) for the Android ABIs; Gradle packs app/src/main/jniLibs into the APK.
      - uses: ./.github/actions/native

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest

      # The release build type must keep working without the production key (it falls back to the debug key here).
      - name: Build release APK (without the production key; debug-signed, never published)
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kinesis-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/

  native:
    name: Rust core (tests, parity with Kotlin, benchmark)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: native-host-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'native/Cargo.toml') }}

      - name: Rust unit tests
        working-directory: native
        run: cargo test --release --locked

      # vid.stab (C, vendored): the stabilizer must cut the shake of a synthetic clip.
      - name: Stabilizer test (vid.stab)
        working-directory: native
        run: cargo test --release --locked --features stabilize --test stabilize

      - name: Build the library (with and without Whisper)
        working-directory: native
        run: |
          cargo build --release --locked --features whisper,stabilize
          cargo build --release --locked

      # With the library built, the core tests also run the Rust text extrusion and compare it with the Kotlin one.
      - name: Core tests with the native library (parity)
        run: ./gradlew --no-daemon :core:test --tests '*NativeParityTest*' --tests '*TextExtrusionTest*' -i

      - name: Benchmark (Kotlin vs Rust)
        run: |
          {
            echo '### Benchmark (ms, median; lower is better)'
            echo '```'
            KINESIS_BENCH=1 ./gradlew --no-daemon :core:test --tests '*CoreBench*' -i | grep -E 'BENCH ' | sed 's/^ *//'
            (cd native && cargo run --release --locked --example bench 2>/dev/null | sed 's/text_extrude_24_glyphs_bevel/text_extrude_24_glyphs_bevel_rust_native/')
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  cli:
    name: CLI and shader checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: CLI tests
        run: python3 -m unittest discover -s tools/tests -v
      - name: Validate GLSL shaders
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          python3 tools/check_shaders.py

  # Manual only (Actions → CI → Run workflow): the emulator job hangs on the hosted runners after
  # RenderTest.everyRegisteredEffectRenders, so it no longer gates pushes and pull requests.
  emulator:
    name: Instrumented tests (emulator)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: ./.github/actions/native

      - name: Build app and test APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Render, export and UI tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/emulator-tests.sh
