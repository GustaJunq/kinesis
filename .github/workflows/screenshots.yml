name: Screenshots

# Runs only the UI smoke test on the emulator and publishes its screenshots as the artifact "kinesis-screenshots".
# Manual, and also when this workflow or its script change.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/screenshots.yml"
      - ".github/scripts/screenshots.sh"

jobs:
  screenshots:
    name: UI screenshots (emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: ./.github/actions/native

      - name: Build app and test APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: UI test and screenshots on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SHOTS_DIR: ${{ github.workspace }}/shots
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/screenshots.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinesis-screenshots
          path: shots/*.jpg
          if-no-files-found: warn
