name: Build the native library
description: "Compiles native/ (Rust, text extrusion and Whisper) for the Android ABIs into app/src/main/jniLibs."
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/bin/cargo-ndk
          native/target
        key: native-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'native/Cargo.toml', 'native/build-android.sh') }}
    - name: Install cargo-ndk
      shell: bash
      run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked
    - name: Build libkinesis_native.so (arm64-v8a, armeabi-v7a, x86_64)
      shell: bash
      run: native/build-android.sh
