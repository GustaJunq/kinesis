[package]
name = "kinesis-native"
version = "0.1.6-hotfix"
edition = "2021"
description = "Native helpers of the Kinesis Editor (text extrusion, Whisper transcription) behind JNI"
license = "GPL-3.0-only"
publish = false

[lib]
name = "kinesis_native"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Local speech-to-text with whisper.cpp (builds C++; needs cmake, and the NDK for Android targets).
whisper = ["dep:whisper-rs"]
# Video stabilization with vid.stab (GPL-2.0-or-later, vendored in third_party/vidstab).
stabilize = []

[build-dependencies]
cc = "1"

[dependencies]
jni = "0.21"
whisper-rs = { version = "0.14", optional = true, default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
